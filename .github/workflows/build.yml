# Builds Celebrimbor for Windows x64 and macOS Apple Silicon.
#   - pushing a tag v* (git tag v0.2.0 && git push origin v0.2.0): GitHub release
#     with both zips attached (a pre-release if the tag has a dash: v0.3.0-rc1)
#   - "Run workflow" on the Actions page: the zips as downloadable artifacts only
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2

      # Not in git (*.task is ignored): fetched here so both get bundled.
      - name: Download models
        run: |
          mkdir -p models
          base=https://storage.googleapis.com/mediapipe-models
          curl -fsSL -o models/hand_landmarker.task "$base/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          curl -fsSL -o models/face_landmarker.task "$base/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

      - name: Build
        run: |
          pyinstaller --noconfirm celebrimbor.spec
          cp gestures.json dist/celebrimbor/
          dist/celebrimbor/celebrimbor --list-gestures

      - name: Name
        id: name
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; else version="${GITHUB_SHA::7}"; fi
          echo "zip=celebrimbor-$version-${{ matrix.platform }}.zip" >> "$GITHUB_OUTPUT"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/celebrimbor/* -DestinationPath "${{ steps.name.outputs.zip }}"

      # ditto keeps the executable bits and the symlinks the app bundle needs.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/celebrimbor "${{ steps.name.outputs.zip }}"

      # The zip, not the folder: artifacts drop the executable bit on macOS.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.zip }}
          path: ${{ steps.name.outputs.zip }}

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" *.zip --repo "${{ github.repository }}" --title "Celebrimbor $TAG" --generate-notes $pre
